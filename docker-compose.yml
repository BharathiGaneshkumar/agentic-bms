services:
  postgres:
    image: postgres:16
    container_name: agentic-bms-postgres
    environment:
      POSTGRES_DB: agentic_bms
      POSTGRES_USER: agentic_bms
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-bms-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage: